name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity for test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Hook and design-gate tests
        run: node --test tests/guard.test.mjs
      - name: Manifests are valid JSON
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','templates/project/.claude/settings.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('ok', f) }"
